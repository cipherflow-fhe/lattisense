name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, gpu]
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/lattisense-ci:latest
      options: >-
        --gpus all
      volumes:
        - /opt/gpu-core-cache:/opt/gpu-core-cache
        - /opt/go-mod-cache:/root/go/pkg/mod
        - /var/lock:/var/lock
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}

      - name: Sync submodules
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive --force
          echo "=== Submodule status ==="
          git submodule status --recursive

      - name: Verify prerequisites
        run: |
          g++ --version | head -1
          cmake --version | head -1
          go version
          nvcc --version | tail -1
          nvidia-smi --query-gpu=name --format=csv,noheader
          python3 --version

      - name: Ensure CMake >= 3.30.4
        run: |
          # lattisense-gpu-core pulls in rmm, which requires CMake 3.30.4+
          need=3.30.4
          current=$(cmake --version | head -1 | awk '{print $3}')
          if [ "$(printf '%s\n%s\n' "$need" "$current" | sort -V | head -1)" != "$need" ]; then
            echo "CMake ${current} is older than ${need}; upgrading"
            pip3 install --no-cache-dir -U "cmake>=${need}" \
              -i https://pypi.tuna.tsinghua.edu.cn/simple \
              || pip3 install --no-cache-dir -U "cmake>=${need}"
          else
            echo "CMake ${current} is recent enough"
          fi
          cmake --version | head -1

      - name: Restore lattisense-gpu-core cache
        run: |
          GPU_CORE_COMMIT=$(git -C backends/lattisense-gpu-core rev-parse HEAD)
          CUDA_ARCH=86
          GPU_CORE_CACHE_KEY="${GPU_CORE_COMMIT}-arch${CUDA_ARCH}"
          GPU_CORE_CACHE_MARKER=".gpu_core_cache_key"
          CACHE_DIR="/opt/gpu-core-cache/${GPU_CORE_CACHE_KEY}"

          if [ -d backends/lattisense-gpu-core/install/lib ] && \
             [ -d backends/lattisense-gpu-core/build ] && \
             [ -f "backends/lattisense-gpu-core/install/${GPU_CORE_CACHE_MARKER}" ] && \
             [ "$(cat "backends/lattisense-gpu-core/install/${GPU_CORE_CACHE_MARKER}")" = "${GPU_CORE_CACHE_KEY}" ]; then
            echo "Using existing lattisense-gpu-core build (${GPU_CORE_COMMIT:0:8}, arch=${CUDA_ARCH})"
          else
            rm -rf backends/lattisense-gpu-core/build backends/lattisense-gpu-core/install
            if [ -d "${CACHE_DIR}/install/lib" ] && \
               [ -d "${CACHE_DIR}/build" ] && \
               [ -f "${CACHE_DIR}/install/${GPU_CORE_CACHE_MARKER}" ] && \
               [ "$(cat "${CACHE_DIR}/install/${GPU_CORE_CACHE_MARKER}")" = "${GPU_CORE_CACHE_KEY}" ]; then
              echo "Using cached lattisense-gpu-core (${GPU_CORE_COMMIT:0:8}, arch=${CUDA_ARCH})"
              cp -a "${CACHE_DIR}/install" backends/lattisense-gpu-core/install
              cp -a "${CACHE_DIR}/build" backends/lattisense-gpu-core/build
              find backends/lattisense-gpu-core/install -name '*.cmake' -exec sed -i \
                "s|${GITHUB_WORKSPACE}/lattisense-gpu-core/|${GITHUB_WORKSPACE}/backends/lattisense-gpu-core/|g" {} +
            else
              echo "No matching lattisense-gpu-core cache found; lattisense-gpu-core will be built during cmake configure"
            fi
          fi

      - name: Build SDK (CPU + GPU + Examples)
        run: |
          cmake -B build \
            -DLATTISENSE_BUILD_TESTS=ON \
            -DLATTISENSE_BUILD_EXAMPLES=ON \
            -DLATTISENSE_ENABLE_GPU=ON \
            -DLATTISENSE_CUDA_ARCH=86
          cmake --build build -j$(nproc)

      - name: Save lattisense-gpu-core cache
        run: |
          GPU_CORE_COMMIT=$(git -C backends/lattisense-gpu-core rev-parse HEAD)
          CUDA_ARCH=86
          GPU_CORE_CACHE_KEY="${GPU_CORE_COMMIT}-arch${CUDA_ARCH}"
          GPU_CORE_CACHE_MARKER=".gpu_core_cache_key"
          CACHE_DIR="/opt/gpu-core-cache/${GPU_CORE_CACHE_KEY}"
          if [ -d "backends/lattisense-gpu-core/install/lib" ] && \
             { [ ! -d "${CACHE_DIR}/install/lib" ] || \
               [ ! -f "${CACHE_DIR}/install/${GPU_CORE_CACHE_MARKER}" ] || \
               [ "$(cat "${CACHE_DIR}/install/${GPU_CORE_CACHE_MARKER}" 2>/dev/null)" != "${GPU_CORE_CACHE_KEY}" ]; }; then
            echo "Saving lattisense-gpu-core build to cache"
            echo "${GPU_CORE_CACHE_KEY}" > "backends/lattisense-gpu-core/install/${GPU_CORE_CACHE_MARKER}"
            rm -rf "${CACHE_DIR}"
            mkdir -p "${CACHE_DIR}"
            cp -a backends/lattisense-gpu-core/install "${CACHE_DIR}/"
            cp -a backends/lattisense-gpu-core/build "${CACHE_DIR}/"
            ls -dt /opt/gpu-core-cache/*/ 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
          fi

      - name: Generate CPU/GPU test data
        run: |
          cd unittests
          export PYTHONPATH=$GITHUB_WORKSPACE/build/unittests:$GITHUB_WORKSPACE:$PYTHONPATH
          python3 -m pytest test_bfv.py -v
          python3 -m pytest test_ckks.py -v

      - name: Run CPU/GPU tests
        timeout-minutes: 20
        run: |
          cd build/unittests
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/lib:$GITHUB_WORKSPACE/backends/lattisense-gpu-core/install/lib:$LD_LIBRARY_PATH
          ./test_bfv
          ./test_ckks

      - name: Run CPU examples
        timeout-minutes: 10
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build:$GITHUB_WORKSPACE/build/fhe_ops_lib:$GITHUB_WORKSPACE/fhe_ops_lib/lattigo/go_sdk:$LD_LIBRARY_PATH

          cd build/examples/bfv_mult_cpu
          python3 bfv_mult_cpu.py && ./bfv_mult_cpu

          cd $GITHUB_WORKSPACE/build/examples/ckks_mult_cpu
          python3 ckks_mult_cpu.py && ./ckks_mult_cpu

          cd $GITHUB_WORKSPACE/build/examples/ckks_mult_serialization_cpu
          ./ckks_mult_serialization_cpu

          cd $GITHUB_WORKSPACE/build/examples/bfv_poly_7_cpu
          python3 bfv_poly_7_cpu.py && ./bfv_poly_7_cpu

          cd $GITHUB_WORKSPACE/build/examples/ckks_euclidean_distance_cpu
          python3 ckks_euclidean_distance_cpu.py && ./ckks_euclidean_distance_cpu

          cd $GITHUB_WORKSPACE/build/examples/ckks_logistic_regression_cpu
          python3 ckks_logistic_regression_cpu.py && ./ckks_logistic_regression_cpu

      - name: Run CPU benchmarks
        timeout-minutes: 10
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build:$GITHUB_WORKSPACE/build/fhe_ops_lib:$GITHUB_WORKSPACE/fhe_ops_lib/lattigo/go_sdk:$LD_LIBRARY_PATH

          cd $GITHUB_WORKSPACE/build/examples/benchmark_cpu
          python3 benchmark_cpu.py && ./benchmark_cpu all

          cd $GITHUB_WORKSPACE/build/examples/benchmark_convolution
          python3 benchmark_convolution.py && ./benchmark_convolution_cpu

      - name: Run GPU benchmarks
        timeout-minutes: 10
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build:$GITHUB_WORKSPACE/build/fhe_ops_lib:$GITHUB_WORKSPACE/fhe_ops_lib/lattigo/go_sdk:$GITHUB_WORKSPACE/backends/lattisense-gpu-core/install/lib:$LD_LIBRARY_PATH

          cd $GITHUB_WORKSPACE/build/examples/benchmark_gpu
          python3 benchmark_gpu.py && ./benchmark_gpu all

          cd $GITHUB_WORKSPACE/build/examples/benchmark_convolution
          ./benchmark_convolution_gpu

  build-docker:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, gpu]
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/lattisense-ci:latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    needs: build-and-test
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t lattisense:latest .

      - name: Verify Docker image
        timeout-minutes: 10
        run: |
          docker run --rm lattisense:latest bash -c "
            cd /workspace/project_template
            python3 bfv_mult.py
            cmake -B build && cmake --build build && cd ..
            ./build/my_fhe_app
          "

      - name: Tag and push Docker image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker tag lattisense:latest "${IMAGE}:latest"
          # Tag with version if this is a tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            docker tag lattisense:latest "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${VERSION}"
          fi
          docker push "${IMAGE}:latest"

      - name: Cleanup
        if: always()
        run: |
          docker image prune -f
